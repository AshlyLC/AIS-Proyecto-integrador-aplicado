<svg xmlns="http://www.w3.org/2000/svg" width="940" height="830" viewBox="0 0 940 830" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="940" height="830" fill="#ffffff"/>

  <!-- Título -->
  <text x="470" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2933">
    Diagrama de Casos de Uso
  </text>
  <text x="470" y="62" text-anchor="middle" font-size="14" fill="#5b6b75">
    Sistema de Registro de Pacientes y Sesiones
  </text>

  <!-- Frontera del sistema -->
  <rect x="330" y="86" width="580" height="690" rx="10" fill="#fbfcfc" stroke="#3f6f78" stroke-width="1.6"/>
  <text x="620" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#2f545b">
    Sistema de Registro de Pacientes y Sesiones
  </text>

  <!-- Separadores y etiquetas de agrupación -->
  <g stroke="#e1e7ea" stroke-width="1.2">
    <line x1="350" y1="272" x2="892" y2="272"/>
    <line x1="350" y1="532" x2="892" y2="532"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#8d99a3" letter-spacing="0.6">
    <text x="350" y="142">ACCESO Y RESUMEN</text>
    <text x="350" y="298">GESTIÓN DE PACIENTES</text>
    <text x="350" y="558">GESTIÓN DE SESIONES</text>
  </g>

  <!-- Actor: Psicóloga -->
  <g stroke="#1f2933" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="150" cy="392" r="21" fill="#ffffff"/>
    <line x1="150" y1="413" x2="150" y2="468"/>
    <line x1="120" y1="434" x2="180" y2="434"/>
    <line x1="150" y1="468" x2="124" y2="510"/>
    <line x1="150" y1="468" x2="176" y2="510"/>
  </g>
  <text x="150" y="542" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2933">Psicóloga</text>
  <text x="150" y="562" text-anchor="middle" font-size="12" fill="#8d99a3">(usuaria única del sistema)</text>

  <!-- Asociaciones actor -> casos de uso -->
  <g stroke="#5b6b75" stroke-width="1.25" fill="none">
    <line x1="186" y1="374" x2="432" y2="176"/>
    <line x1="188" y1="380" x2="432" y2="234"/>
    <line x1="190" y1="386" x2="432" y2="320"/>
    <line x1="191" y1="392" x2="432" y2="378"/>
    <line x1="190" y1="398" x2="432" y2="436"/>
    <line x1="188" y1="404" x2="432" y2="494"/>
    <line x1="180" y1="420" x2="432" y2="580"/>
    <line x1="176" y1="430" x2="432" y2="638"/>
    <line x1="172" y1="440" x2="432" y2="696"/>
  </g>

  <!-- Casos de uso -->
  <g font-size="14" fill="#1f2933" text-anchor="middle">
    <ellipse cx="620" cy="176" rx="186" ry="27" fill="#e8f1f2" stroke="#3f6f78" stroke-width="1.5"/>
    <text x="620" y="181">CU-01   Iniciar sesión</text>

    <ellipse cx="620" cy="234" rx="186" ry="27" fill="#e8f1f2" stroke="#3f6f78" stroke-width="1.5"/>
    <text x="620" y="239">CU-02   Consultar resumen general</text>

    <ellipse cx="620" cy="320" rx="186" ry="27" fill="#ffffff" stroke="#3f6f78" stroke-width="1.5"/>
    <text x="620" y="325">CU-03   Registrar paciente</text>

    <ellipse cx="620" cy="378" rx="186" ry="27" fill="#ffffff" stroke="#3f6f78" stroke-width="1.5"/>
    <text x="620" y="383">CU-04   Buscar y consultar pacientes</text>

    <ellipse cx="620" cy="436" rx="186" ry="27" fill="#ffffff" stroke="#3f6f78" stroke-width="1.5"/>
    <text x="620" y="441">CU-05   Editar datos del paciente</text>

    <ellipse cx="620" cy="494" rx="186" ry="27" fill="#ffffff" stroke="#3f6f78" stroke-width="1.5"/>
    <text x="620" y="491">CU-06   Activar o desactivar paciente</text>
    <text x="620" y="507" font-size="11" fill="#5b6b75">(sin borrar su información)</text>

    <ellipse cx="620" cy="580" rx="186" ry="27" fill="#ffffff" stroke="#3f6f78" stroke-width="1.5"/>
    <text x="620" y="585">CU-07   Registrar sesión</text>

    <ellipse cx="620" cy="638" rx="186" ry="27" fill="#ffffff" stroke="#3f6f78" stroke-width="1.5"/>
    <text x="620" y="643">CU-08   Consultar historial de sesiones</text>

    <ellipse cx="620" cy="696" rx="186" ry="27" fill="#ffffff" stroke="#3f6f78" stroke-width="1.5"/>
    <text x="620" y="701">CU-09   Editar sesión registrada</text>
  </g>

  <!-- Nota al pie -->
  <text x="470" y="808" text-anchor="middle" font-size="11.5" fill="#8d99a3">
    Todos los casos de uso requieren haber realizado previamente CU-01 (Iniciar sesión).
  </text>
</svg>
