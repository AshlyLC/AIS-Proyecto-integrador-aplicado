<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2933">
    Diagrama de Clases
  </text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#5b6b75">
    Sistema de Registro de Pacientes y Sesiones
  </text>

  <!-- ================= Clase Usuario ================= -->
  <g>
    <rect x="60" y="110" width="240" height="176" rx="4" fill="#ffffff" stroke="#3f6f78" stroke-width="1.6"/>
    <rect x="60" y="110" width="240" height="34" rx="4" fill="#e8f1f2" stroke="#3f6f78" stroke-width="1.6"/>
    <text x="180" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#2f545b">Usuario</text>
    <line x1="60" y1="144" x2="300" y2="144" stroke="#3f6f78" stroke-width="1.6"/>
    <g font-size="12.5" fill="#1f2933">
      <text x="72" y="164">- id : Integer</text>
      <text x="72" y="184">- usuario : String</text>
      <text x="72" y="204">- nombre : String</text>
      <text x="72" y="224">- passwordHash : String</text>
    </g>
    <line x1="60" y1="238" x2="300" y2="238" stroke="#3f6f78" stroke-width="1.2"/>
    <g font-size="12.5" fill="#1f2933">
      <text x="72" y="258">+ verificarPassword() : Boolean</text>
      <text x="72" y="277">+ iniciarSesion() : void</text>
    </g>
  </g>

  <!-- ================= Clase Paciente ================= -->
  <g>
    <rect x="380" y="110" width="270" height="392" rx="4" fill="#ffffff" stroke="#3f6f78" stroke-width="1.6"/>
    <rect x="380" y="110" width="270" height="34" rx="4" fill="#e8f1f2" stroke="#3f6f78" stroke-width="1.6"/>
    <text x="515" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#2f545b">Paciente</text>
    <line x1="380" y1="144" x2="650" y2="144" stroke="#3f6f78" stroke-width="1.6"/>
    <g font-size="12.5" fill="#1f2933">
      <text x="392" y="164">- id : Integer</text>
      <text x="392" y="183">- expediente : String  {unique}</text>
      <text x="392" y="202">- nombre : String</text>
      <text x="392" y="221">- fechaNacimiento : Date</text>
      <text x="392" y="240">- edad : Integer</text>
      <text x="392" y="259">- sexo : String</text>
      <text x="392" y="278">- ocupacion : String</text>
      <text x="392" y="297">- telefono : String</text>
      <text x="392" y="316">- correo : String</text>
      <text x="392" y="335">- fechaApertura : Date</text>
      <text x="392" y="354">- motivoConsulta : Text</text>
      <text x="392" y="373">- antecedentes : Text</text>
      <text x="392" y="392">- estado : String</text>
    </g>
    <line x1="380" y1="406" x2="650" y2="406" stroke="#3f6f78" stroke-width="1.2"/>
    <g font-size="12.5" fill="#1f2933">
      <text x="392" y="426">+ generarExpediente() : String</text>
      <text x="392" y="445">+ guardar() : Integer</text>
      <text x="392" y="464">+ buscar(termino) : Lista</text>
      <text x="392" y="483">+ cambiarEstado(estado) : void</text>
    </g>
  </g>

  <!-- ================= Clase Sesion ================= -->
  <g>
    <rect x="730" y="110" width="240" height="335" rx="4" fill="#ffffff" stroke="#3f6f78" stroke-width="1.6"/>
    <rect x="730" y="110" width="240" height="34" rx="4" fill="#e8f1f2" stroke="#3f6f78" stroke-width="1.6"/>
    <text x="850" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#2f545b">Sesion</text>
    <line x1="730" y1="144" x2="970" y2="144" stroke="#3f6f78" stroke-width="1.6"/>
    <g font-size="12.5" fill="#1f2933">
      <text x="742" y="164">- id : Integer</text>
      <text x="742" y="183">- pacienteId : Integer  {FK}</text>
      <text x="742" y="202">- numeroSesion : Integer</text>
      <text x="742" y="221">- fecha : Date</text>
      <text x="742" y="240">- tema : String</text>
      <text x="742" y="259">- resumen : Text</text>
      <text x="742" y="278">- tareas : Text</text>
      <text x="742" y="297">- nivelAvance : String</text>
      <text x="742" y="316">- proximaSesion : Date</text>
    </g>
    <line x1="730" y1="330" x2="970" y2="330" stroke="#3f6f78" stroke-width="1.2"/>
    <g font-size="12.5" fill="#1f2933">
      <text x="742" y="350">+ numeroSiguiente() : Integer</text>
      <text x="742" y="369">+ guardar() : Integer</text>
      <text x="742" y="388">+ listarPorPaciente() : Lista</text>
      <text x="742" y="407">+ obtener(id) : Sesion</text>
    </g>
  </g>

  <!-- ================= Relación Usuario - Paciente ================= -->
  <line x1="300" y1="200" x2="380" y2="200" stroke="#5b6b75" stroke-width="1.5"/>
  <polygon points="300,200 312,194 324,200 312,206" fill="#ffffff" stroke="#5b6b75" stroke-width="1.4"/>
  <text x="340" y="192" text-anchor="middle" font-size="11.5" fill="#5b6b75">gestiona</text>
  <text x="330" y="217" font-size="11.5" fill="#8d99a3">1</text>
  <text x="352" y="217" font-size="11.5" fill="#8d99a3">0..*</text>

  <!-- ================= Relación Paciente - Sesion (1 a N) ================= -->
  <line x1="650" y1="240" x2="730" y2="240" stroke="#5b6b75" stroke-width="1.5"/>
  <polygon points="650,240 663,233 676,240 663,247" fill="#3f6f78" stroke="#3f6f78" stroke-width="1.4"/>
  <text x="690" y="232" text-anchor="middle" font-size="11.5" fill="#5b6b75">registra</text>
  <text x="682" y="257" font-size="11.5" fill="#8d99a3">1</text>
  <text x="712" y="257" font-size="11.5" fill="#8d99a3">0..*</text>

  <!-- ================= Leyenda ================= -->
  <rect x="60" y="530" width="590" height="130" rx="8" fill="#fbfcfc" stroke="#e1e7ea" stroke-width="1.3"/>
  <text x="80" y="556" font-size="13" font-weight="600" fill="#2f545b">Notas del modelo</text>
  <g font-size="12" fill="#5b6b75">
    <text x="80" y="580">•  Un Paciente tiene muchas Sesiones (1 a N). Es la relación central del sistema.</text>
    <text x="80" y="601">•  La composición (rombo relleno) indica que una Sesión no existe sin su Paciente:</text>
    <text x="94" y="620">al eliminar un paciente se eliminan sus sesiones (ON DELETE CASCADE).</text>
    <text x="80" y="641">•  El atributo «expediente» es único; el sistema lo genera solo (EXP-001, EXP-002…).</text>
  </g>

  <!-- Símbolos de la leyenda -->
  <g>
    <polygon points="700,565 715,556 730,565 715,574" fill="#3f6f78" stroke="#3f6f78" stroke-width="1.3"/>
    <text x="742" y="570" font-size="11.5" fill="#5b6b75">Composición</text>
    <polygon points="700,600 715,591 730,600 715,609" fill="#ffffff" stroke="#5b6b75" stroke-width="1.3"/>
    <text x="742" y="605" font-size="11.5" fill="#5b6b75">Agregación</text>
    <text x="700" y="640" font-size="11.5" fill="#5b6b75">1 · 0..*   Multiplicidad</text>
  </g>
</svg>
