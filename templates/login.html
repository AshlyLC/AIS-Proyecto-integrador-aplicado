{% extends "base.html" %}
{% block titulo %}Acceso al sistema{% endblock %}

{% block contenido_publico %}
<div class="acceso">
  <div class="acceso__caja">
    <div class="acceso__logo">◈</div>
    <h1>Registro de Pacientes</h1>
    <p>Consulta psicológica</p>

    {% include "_mensajes.html" %}

    <form method="post">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required autofocus>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn--ancho">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
